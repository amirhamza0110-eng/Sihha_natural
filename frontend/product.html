<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Sihha Naturals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { choco: '#4e342e', chocoDark: '#3e2723', lightGreen: '#e8f5e9', natureGreen: '#2e7d32' } } } }
    </script>
</head>
<body class="bg-lightGreen text-choco font-sans flex flex-col min-h-screen">

    <!-- Header (Updated with Cart Button) -->
    <header class="bg-white shadow-md sticky top-0 z-50 py-3">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-extrabold text-natureGreen tracking-wide">
                <i class="fa-solid fa-leaf text-choco mr-1"></i>Sihha
            </a>
            <div class="flex gap-4">
                <a href="javascript:void(0)" onclick="toggleCart()" class="text-choco hover:text-natureGreen font-bold flex items-center gap-2 bg-lightGreen px-4 py-2 rounded-full transition cursor-pointer">
                    <i class="fa-solid fa-cart-shopping"></i> Cart (<span id="cart-count">0</span>)
                </a>
                <a href="index.html" class="text-choco hover:text-natureGreen font-semibold flex items-center"><i class="fa-solid fa-arrow-left mr-1"></i> Store</a>
            </div>
        </div>
    </header>

    <!-- Product Details -->
    <main class="container mx-auto px-4 mt-10 mb-20 flex-grow">
        <div id="loading-msg" class="text-center text-lg font-semibold text-chocoDark mt-10">Loading product details...</div>
        
        <div id="product-details-container" class="hidden bg-white rounded-2xl shadow-lg overflow-hidden max-w-5xl mx-auto flex flex-col md:flex-row">
            <div class="w-full md:w-1/2 bg-gray-50 flex justify-center items-center p-6">
                <img id="pd-image" src="" class="w-full max-h-[500px] object-contain rounded-lg shadow-sm">
            </div>

            <div class="w-full md:w-1/2 p-8 lg:p-12 flex flex-col justify-center">
                <span id="pd-category" class="text-xs font-bold text-natureGreen bg-lightGreen px-3 py-1 rounded-full uppercase tracking-widest inline-block w-max mb-3"></span>
                <h1 id="pd-name" class="text-3xl lg:text-4xl font-bold text-chocoDark mb-4"></h1>
                <div class="text-3xl font-extrabold text-natureGreen mb-6">৳<span id="pd-price"></span></div>
                
                <div class="mb-6">
                    <h3 class="text-lg font-semibold border-b border-gray-200 pb-2 mb-2">Description</h3>
                    <p id="pd-description" class="text-gray-600 leading-relaxed whitespace-pre-wrap"></p>
                </div>
                
                <p class="mb-8 font-semibold text-sm"><i class="fa-solid fa-box mr-2"></i>Stock: <span id="pd-stock" class="text-natureGreen"></span> units available</p>

                <div class="flex flex-col sm:flex-row gap-4 mt-auto">
                    <button id="pd-add-to-cart-btn" class="flex-1 bg-white border-2 border-natureGreen text-natureGreen font-bold py-3 px-6 rounded-lg hover:bg-natureGreen hover:text-white transition-colors flex justify-center items-center gap-2">
                        <i class="fa-solid fa-cart-plus"></i> Add to Cart
                    </button>
                    <button onclick="openOrderModal()" class="flex-1 bg-choco text-white font-bold py-3 px-6 rounded-lg hover:bg-natureGreen transition-colors flex justify-center items-center gap-2 shadow-md">
                        <i class="fa-bolt fa-solid"></i> Order Now
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Direct Order Modal (For single product) -->
    <div id="order-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex justify-center items-center z-[100] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-natureGreen text-white px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold"><i class="fa-solid fa-bag-shopping mr-2"></i> Complete Order</h2>
                <button onclick="closeOrderModal()" class="text-white hover:text-red-200 transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div class="p-6 bg-gray-50">
                <form id="order-form" class="space-y-4">
                    <input type="text" id="customer-name" required placeholder="Your Name" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-natureGreen outline-none">
                    <input type="tel" id="customer-phone" required placeholder="Phone Number (01XXX...)" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-natureGreen outline-none">
                    <select id="delivery-area" onchange="calculateTotal()" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-natureGreen outline-none font-semibold">
                        <option value="70">Inside Dhaka (৳70)</option>
                        <option value="120">Outside Dhaka (৳120)</option>
                    </select>
                    <textarea id="customer-address" rows="2" required placeholder="Full Delivery Address..." class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-natureGreen outline-none"></textarea>
                    
                    <div class="bg-lightGreen p-4 rounded-lg mt-5 border border-green-200">
                        <div class="flex justify-between text-sm mb-2 text-gray-700"><span>Product Price:</span><span class="font-bold">৳<span id="bill-price">0</span></span></div>
                        <div class="flex justify-between text-sm mb-2 pb-2 border-b border-green-300 text-gray-700"><span>Delivery Charge:</span><span class="font-bold">৳<span id="bill-delivery">70</span></span></div>
                        <div class="flex justify-between text-xl mt-2 font-extrabold text-natureGreen"><span>Total Bill:</span><span>৳<span id="bill-total">0</span></span></div>
                    </div>

                    <button type="submit" class="w-full bg-choco text-white font-bold py-3.5 rounded-lg hover:bg-natureGreen transition-colors mt-4 shadow-md flex justify-center items-center gap-2">
                        Confirm Order <i class="fa-brands fa-whatsapp text-xl"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Cart Drawer & Checkout Modal (For multiple items) -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black bg-opacity-50 hidden z-[105]"></div>
    <div id="cart-drawer" class="fixed inset-y-0 right-0 w-80 sm:w-96 bg-gray-50 shadow-2xl transform translate-x-full transition-transform duration-300 z-[110] flex flex-col">
        <div class="p-4 bg-natureGreen text-white flex justify-between items-center shadow-md">
            <h2 class="text-xl font-bold"><i class="fa-solid fa-cart-shopping mr-2"></i> Your Cart</h2>
            <button onclick="toggleCart()" class="text-white hover:text-red-200"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-6 border-t bg-white shadow-inner">
            <div class="flex justify-between font-extrabold text-lg mb-4 text-chocoDark">
                <span>Subtotal:</span><span>৳<span id="cart-subtotal">0</span></span>
            </div>
            <button onclick="openCartModal()" class="w-full bg-choco text-white font-bold py-3.5 rounded-lg hover:bg-natureGreen transition-colors flex justify-center items-center gap-2">
                Checkout Now <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="cart-order-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex justify-center items-center z-[120] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-natureGreen text-white px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold"><i class="fa-solid fa-bag-shopping mr-2"></i> Checkout Cart</h2>
                <button onclick="closeCartModal()" class="text-white hover:text-red-200 transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div class="p-6 bg-gray-50">
                <form id="cart-order-form" class="space-y-4">
                    <input type="text" id="cart-customer-name" required placeholder="Your Name" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-natureGreen outline-none">
                    <input type="tel" id="cart-customer-phone" required placeholder="Phone Number (01XXX...)" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-natureGreen outline-none">
                    <select id="cart-delivery-area" onchange="calculateCartTotal()" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-natureGreen outline-none font-semibold">
                        <option value="70">Inside Dhaka (৳70)</option>
                        <option value="120">Outside Dhaka (৳120)</option>
                    </select>
                    <textarea id="cart-customer-address" rows="2" required placeholder="Full Delivery Address..." class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-natureGreen outline-none"></textarea>
                    <div class="bg-lightGreen p-4 rounded-lg mt-5 border border-green-200">
                        <div class="flex justify-between text-sm mb-2 text-gray-700"><span>Subtotal:</span><span class="font-bold">৳<span id="cart-bill-price">0</span></span></div>
                        <div class="flex justify-between text-sm mb-2 pb-2 border-b border-green-300 text-gray-700"><span>Delivery Charge:</span><span class="font-bold">৳<span id="cart-bill-delivery">70</span></span></div>
                        <div class="flex justify-between text-xl mt-2 font-extrabold text-natureGreen"><span>Total Bill:</span><span>৳<span id="cart-bill-total">0</span></span></div>
                    </div>
                    <button type="submit" class="w-full bg-choco text-white font-bold py-3.5 rounded-lg hover:bg-natureGreen transition-colors mt-4 shadow-md flex justify-center items-center gap-2">
                        Confirm Order <i class="fa-brands fa-whatsapp text-xl"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts: cart.js MUST be before product.js -->
    <script src="cart.js"></script>
    <script src="product.js"></script>
</body>
</html>
